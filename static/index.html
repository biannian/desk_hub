<script>
    /** 看板客户端模块。@author Kai @date 2026/10/23 15:51 @description 只由本地时钟驱动秒级显示，状态通过推送更新。 */
    // @author Kai @date 2026/10/23 16:34：新完成任务持续提醒到用户确认，不重复弹出历史完成记录。
    const noticeSince = Number(localStorage.getItem("desk-hub-notice-since")) || Date.now();
    localStorage.setItem("desk-hub-notice-since", String(noticeSince));
    let viewed = new Set();
    try { viewed = new Set(JSON.parse(localStorage.getItem("desk-hub-viewed") || "[]")); } catch (_) { /* 无效记录重新确认。 */ }
    const noticeKey = (task) => task.tool + ":" + task.task_id + ":" + task.occurred_at;
    const needsReview = (task) => task.state === "completed" && !task.viewed && new Date(task.occurred_at).getTime() >= noticeSince && !viewed.has(noticeKey(task));
    const labels = {queued: "等待执行", running: "执行中", waiting_user: "等待确认", completed: "完成", failed: "失败", interrupted: "已中断", unknown: "未知"};
    // 连接和缓存状态只保存在本设备；任务权威数据保存在 Windows SQLite。
    let token = localStorage.getItem("desk-hub-token") || "";
    let data = null, socket = null, online = false, lastMessage = 0, retry = null;
    try { data = JSON.parse(localStorage.getItem("desk-hub-last") || "null"); } catch (_) { /* 损坏缓存等待服务器重新同步。 */ }
    const el = (id) => document.getElementById(id);
    /** 安全写入文本，事件摘要不得作为 HTML 执行。@param id 元素标识 @param text 内容 @author Kai @date 2026/10/23 15:51 */
    function text(id, text) { el(id).textContent = text || ""; }
    /** 格式化真实时间。@param value ISO 时间 @return 展示字符串 @author Kai @date 2026/10/23 15:51 */
    function time(value) { return value ? new Date(value).toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit", timeZone: "Asia/Shanghai"}) : "--"; }
    /** 格式化核验时间，统一按中国时区展示。@param value 导出更新时间 @return 今天时刻或完整日期时刻 @author Kai @date 2026/10/23 16:15 */
    function verifiedTime(value) {
        if (!value) return "尚无记录";
        // 原助手写出不带时区的本地时间，明确作为中国时间解析。
        const normalized = /(?:Z|[+-]\d{2}:?\d{2})$/.test(value) ? value : value + "+08:00";
        const date = new Date(normalized);
        if (Number.isNaN(date.getTime())) return "时间未知";
        const options = {timeZone: "Asia/Shanghai"};
        const today = date.toLocaleDateString("sv-SE", options) === new Date().toLocaleDateString("sv-SE", options);

    /** 重建连接并立即拉取快照，兼容手机休眠后半关闭的 WebSocket。

            if (version !== connectVersion) return;
            if (response.status === 401) { el("login").hidden = false; connection(false); text("connection", "令牌无效，请重新连接"); return; }

    /** 格式化服务报告的窗口重置倒计时，不推断下一个周期额度。

    function quotaCountdown(resetsAt) {

        const days = Math.floor(totalMinutes / 1440);
        const hours = Math.floor(totalMinutes % 1440 / 60);
        const minutes = totalMinutes % 60;
        return (days ? days + "天 " : "") + String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0");
    }

        const valid = known;

        brush.fillText(detail, 0, 23, width);
        // 像素游戏的分格能量槽：硬边、短投影、顶部高光，避免大面积发亮。
        // @author Kai @date 2026/11/02 14:01
        brush.fillStyle = "#100d1b"; brush.fillRect(3, 39, width, 17);
        brush.strokeStyle = "#635082"; brush.lineWidth = 2; brush.strokeRect(0, 34, width, 19);
        const slots = 20, gap = 3, slotWidth = (width - 8 - gap * (slots - 1)) / slots;
        const fillEnd = valid ? remaining / 100 * (width - 8) : 0;
        for (let index = 0; index < slots; index++) {
            const left = index * (slotWidth + gap);
            brush.fillStyle = "#211a32"; brush.fillRect(4 + left, 38, slotWidth, 11);
            const activeWidth = Math.max(0, Math.min(slotWidth, fillEnd - left));
            if (activeWidth > 0) {
                brush.fillStyle = color; brush.fillRect(4 + left, 38, activeWidth, 11);
                brush.fillStyle = accent === "#c4b2ee" || label === "周额度" ? "#c4b2ee" : "#a2e0df";
                brush.fillRect(4 + left, 38, activeWidth, 2);
            }
        }
        brush.restore();
    }
    /** 绘制七天增量趋势；空心占位表示无记录，统计不补零。
     * @param trend 七日快照 @param portrait 是否竖屏 @author Kai @date 2026/11/02 09:58 */
    function paintUsageTrend(trend, portrait, layoutW, layoutH) {
        const days = trend.days || [];
        const width = layoutW * 0.94, top = layoutH * 0.12;
        // 底部信息区保留 64px；日期与信息区之间另留 16px，禁止侵入。
        // @author Kai @date 2026/11/02 14:04
        const footerTop = layoutH / 2 - 64;
        // 标题与汇总占独立区域，最高柱的数字也必须留在绘图区内。
        // @author Kai @date 2026/11/02 14:03
        const chartBottom = footerTop - 16 - top - 18;
        const chartTop = portrait ? 58 : 36;
        const chartHeight = Math.max(2, chartBottom - chartTop);
        const max = Math.max(1, ...days.map(day => day.tokens || 0));
        brush.save(); brush.translate(-width / 2, top);
        brush.textAlign = "left"; brush.font = monitorFont(17); brush.fillStyle = "#a395bf";
        brush.fillText("近 7 天" + (trend.partial ? "（部分记录）" : "用量趋势"), 0, 0);
        brush.textAlign = "right";
        brush.fillText("合计 " + usageNumber(trend.total) + "  记录日均 " + usageNumber(trend.daily_average), width, portrait ? 22 : 0, portrait ? width : width * 0.65);
        const slot = width / 7;
        days.forEach((day, index) => {
            const x = slot * (index + 0.5), height = day.tokens === null ? 0 : Math.max(2, day.tokens / max * chartHeight);
            brush.textAlign = "center"; brush.font = monitorFont(14);
            if (day.tokens === null) {
                brush.strokeStyle = "#384357"; brush.strokeRect(x - 9, chartBottom - 3, 18, 3);
                brush.fillStyle = "#65768f"; brush.fillText("无记录", x, chartBottom - 11);
            } else {
                brush.fillStyle = index === 6 ? "#78cdd2" : "#8472ae";
                brush.fillRect(x - 9, chartBottom - height, 18, height);
                brush.fillStyle = index === 6 ? "#a2e0df" : "#b3a1d6";
                brush.fillRect(x - 9, chartBottom - height, 18, Math.min(2, height));
                brush.fillStyle = "#91a4be"; brush.fillText(usageNumber(day.tokens), x, chartBottom - 6 - height);
            }
            brush.fillStyle = "#7385a1"; brush.fillText(day.date.slice(5).replace("-", "/"), x, chartBottom + 18);
        });
        brush.textAlign = "center"; brush.font = monitorFont(14); brush.fillStyle = "#65768f";
        // 日均口径通过标题说明，避免占用同屏趋势区域。
        brush.restore();
    }
    /** 生成屏保考勤摘要，沿用助手时间，不推断最终考勤状态。
     * @param attendance 当日考勤快照 @return 单行考勤文本
     * @author Kai @date 2026/11/02 11:25 */
    function saverAttendance(attendance) {
        if (!attendance) return "考勤数据暂不可用";
        if (attendance.workday === false) return "今天休息";
        if (!attendance.ok) return "考勤数据暂不可用";
        if (!attendance.in_time) return "尚无上班记录";
        const clockIn = "上班 " + time(attendance.in_time);
        if (!online) return "上次考勤 · " + clockIn + (attendance.target_time ? " · 可下班 " + time(attendance.target_time) : "");
        const target = Date.parse(attendance.target_time);
        if (!Number.isFinite(target)) return clockIn + " · 预计下班时间待确认";
        const minutes = Math.ceil((target - Date.now()) / 60000);
        if (minutes <= 0) return clockIn + " · 可以下班了";
        // 复用业务配置的临近下班阈值；倒计时只在在线场景使用。
        const threshold = Math.max(1, Number((attendance.display || {}).near_minutes) || 20);
        return clockIn + " · " + (minutes <= threshold ? "还有 " + minutes + " 分钟可下班" : "预计可下班 " + time(attendance.target_time));
    }
    /** 屏保窗口名称：优先用服务给定标签，Codex 仍用 5 小时和周额度。
     * @param item 额度窗口 @return 窗口名称 @author Kai @date 2026/11/20 09:32 */
    function saverQuotaLabel(item) {
        if (!item) return "额度";
        if (item.label === "套餐额度") return "";
        if (item.label) return item.label;
        if (item.minutes === 300) return "5 小时额度";
        if (item.minutes === 10080) return "周额度";
        return quotaWindowName(item);
    }
    /** 格式化某个来源的额度更新年龄。
     * @param source 用量快照 @return 来源加更新时间 @author Kai @date 2026/11/20 09:32 */
    function quotaAge(source) {
        const stamp = Date.parse(source && (source.limits_updated_at || source.updated_at));
        const name = source && source.provider_name || "额度";
        if (!Number.isFinite(stamp)) return name + " 未读取";
        const age = Math.max(0, Math.floor((Date.now() - stamp) / 60000));
        return name + " " + (age < 1 ? "刚刚" : age < 60 ? age + " 分钟前" : Math.floor(age / 60) + " 小时前");
    }
    /** 同一屏绘制 Codex 与 Cursor：横屏左右分栏，竖屏上下叠放。
     * @param sources 用量来源 @param layoutW 布局宽度 @param layoutH 布局高度 @param portrait 是否竖屏
     * @author Kai @date 2026/11/20 09:32 */
    function paintSharedQuotas(sources, layoutW, layoutH, portrait) {
        const board = sources.filter(source => source && source.provider_id);
        const accents = {codex: "#78cdd2", cursor: "#c4b2ee"};
        if (!board.length) {
            brush.textAlign = "left"; brush.font = monitorFont(18); brush.fillStyle = "#7f90aa";
            brush.fillText("未选择要监听的 AI", -layoutW * 0.47, -layoutH * 0.2);
            return;
        }
        const gap = 28;
        const width = board.length < 2 || portrait ? layoutW * 0.94 : (layoutW * 0.94 - gap) / board.length;
        board.forEach((source, index) => {
            const limits = Array.isArray(source.limits) ? source.limits : [];
            const stamp = Date.parse(source.limits_updated_at || source.updated_at);
            const stale = !Number.isFinite(stamp) || Date.now() - stamp > 15 * 60000;
            const left = portrait ? -width / 2 : -layoutW * 0.47 + index * (width + gap);
            const top = portrait ? -layoutH * 0.46 + index * 210 : -layoutH * 0.40;
            brush.save(); brush.translate(left + width / 2, top);
            const accent = accents[source.provider_id] || "#b1bbd4";
            brush.textAlign = "left"; brush.font = monitorFont(portrait ? 16 : 19, true); brush.fillStyle = accent;
            brush.fillText(source.provider_name || "额度", -width / 2, 0);
            brush.textAlign = "right"; brush.font = monitorFont(13); brush.fillStyle = "#7f90aa";
            brush.fillText(quotaAge(source), width / 2, 0);
            brush.restore();
            brush.save(); brush.translate(left + width / 2, 0);
            const barLabel = (item) => source.provider_id === "cursor" && (!item || !item.label || item.label === "套餐额度") ? "" : saverQuotaLabel(item);
            paintQuotaBar(limits[0], barLabel(limits[0]), top + 46, width, stale, accent);
            if (limits[1]) paintQuotaBar(limits[1], barLabel(limits[1]), top + 124, width, stale, accent);
            brush.restore();
        });
    }
    /** 绘制漂浮 Token 仪表盘，纯黑底、所有文字随场景移动，保留事件切换动画。
     * @param now 浏览器动画时钟 @author Kai @date 2026/11/02 09:54 */
    // 限制到约 30 帧，避免旧手机持续高负载重绘。
    let lastUsageFrame = -Infinity;
    function paintOled(now) {
        requestAnimationFrame(paintOled);
        if (oled.hidden || document.hidden || now - lastUsageFrame < 33) return;
        lastUsageFrame = now;
        const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
        // 以物理像素绘制文字，最多 2 倍分辨率，兼顾旧手机清晰度和绘制开销。
        // @author Kai @date 2026/11/02 10:08
        const ratio = Math.min(2, window.devicePixelRatio || 1);
        const pixelW = Math.round(w * ratio), pixelH = Math.round(h * ratio);
        if (oled.width !== pixelW || oled.height !== pixelH) { oled.width = pixelW; oled.height = pixelH; }
        brush.setTransform(ratio, 0, 0, ratio, 0, 0);
        brush.fillStyle = "#000000"; brush.fillRect(0, 0, w, h);
        if (oled.dataset.quiet === "yes") return;
        const t = now / 1000, portrait = h > w;
        // 布局占满可视高度、使用 90% 屏宽；只调整元素间距，不拉伸字体和额度条。
        // @author Kai @date 2026/11/02 10:16
        // 上下各留约 5% 空间，纵向换位不会把底部文字移出屏幕。
        // @author Kai @date 2026/11/02 14:48
        const scale = Math.min(w * 0.90 / (portrait ? 340 : 700), h * 0.90 / (portrait ? 620 : 420));
        const layoutW = w * 0.90 / scale, layoutH = h * 0.90 / scale;
        // 每 45 秒在三秒内平滑横纵换位，其他时间保持静止。
        const step = Math.floor(t / 45), progress = Math.min(1, (t % 45) / 3);
        const ease = progress * progress * (3 - 2 * progress);
        const previousX = Math.sin((step - 1) * 2.4), nextX = Math.sin(step * 2.4);
        const dx = (previousX + (nextX - previousX) * ease) * w * 0.015;
        const previousY = Math.sin((step - 1) * 1.7), nextY = Math.sin(step * 1.7);
        const dy = (previousY + (nextY - previousY) * ease) * h * 0.015;
        brush.save(); brush.translate(w / 2 + dx, h / 2 + dy); brush.scale(scale, scale);
        const usage = data && data.usage || {};
        // Codex 与 Cursor 同时留在这一屏，横屏分左右，竖屏上下叠放。
        // @author Kai @date 2026/11/20 09:32
        const sources = data && Array.isArray(data.usages) && data.usages.length ? data.usages : [usage];
        paintSharedQuotas(sources, layoutW, layoutH, portrait);
        if (!portrait && usage.trend && Array.isArray(usage.trend.days) && usage.trend.days.length) paintUsageTrend(usage.trend, portrait, layoutW, layoutH);
        brush.font = monitorFont(14); brush.fillStyle = "#687d94";
        const updated = (online ? "" : "离线缓存 · ") + sources.map(quotaAge).join("  ·  ");
        // 底部独立双行信息区，共用左侧对齐线；不继承趋势图的文字对齐状态。
        // @author Kai @date 2026/11/02 14:04
        const footerLeft = -layoutW * 0.47, footerTop = layoutH / 2 - 64;
        brush.textAlign = "left"; brush.textBaseline = "alphabetic";
        brush.strokeStyle = "#352d47"; brush.lineWidth = 1;
        brush.beginPath(); brush.moveTo(footerLeft, footerTop); brush.lineTo(-footerLeft, footerTop); brush.stroke();
        brush.fillText(updated, footerLeft, footerTop + 24, layoutW * 0.94);
        // 考勤摘要与整个屏保共享位移，不增加固定发光元素。
        brush.font = monitorFont(18); brush.fillStyle = "#a0c8c4";
        brush.fillText(saverAttendance(data && data.attendance), footerLeft, footerTop + 50, layoutW * 0.94);

        brush.restore();
    }
    requestAnimationFrame(paintOled);
    // 连接自动恢复，手机界面不依赖 Fullscreen API。
    el("connect").onclick = () => { token = el("token").value.trim(); localStorage.setItem("desk-hub-token", token); connect(); };
    el("logout").onclick = () => { ++connectVersion; clearTimeout(retry); if (socket) { socket.onclose = null; socket.close(); } token = ""; localStorage.removeItem("desk-hub-token"); el("login").hidden = false; connection(false); };
    // 不依赖 socket.close 回调触发重试，防止手机休眠后永远卡在离线缓存。
    setInterval(() => {
        if (token && !document.hidden && el("login").hidden && Date.now() - lastMessage > 12000 && Date.now() - lastConnectAttempt > 12000) {
            connection(false); connect();
        }
        tick();
    }, 1000);
    if (data) { render(data); connection(false); } if (token) connect(); tick();
</script>
</html>
